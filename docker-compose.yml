services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quasselstrippe-frontend
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quasselstrippe-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_PATH=/data/quasselstrippe.db
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - NODE_ENV=production
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD in .env before starting}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persistent SQLite database storage
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
