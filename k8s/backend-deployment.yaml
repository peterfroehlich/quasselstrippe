apiVersion: apps/v1
kind: Deployment
metadata:
  name: quasselstrippe-backend
  namespace: quasselstrippe
  labels:
    app.kubernetes.io/name: quasselstrippe-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: quasselstrippe
spec:
  # SQLite is a single-writer file-based database.
  # Replicas must be 1 with strategy Recreate to avoid multi-pod file lock conflicts on RWO PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quasselstrippe-backend
  template:
    metadata:
      labels:
        app: quasselstrippe-backend
        app.kubernetes.io/name: quasselstrippe-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: backend
          image: quasselstrippe-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: quasselstrippe-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quasselstrippe-secret
                  key: GEMINI_API_KEY
                  optional: true
          # Startup probe: gives the container time to initialize DB and schema
          startupProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 2
          # Liveness probe: checks if the Node.js event loop is alive
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          # Readiness probe: verifies SQLite database connectivity & drains during SIGTERM
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: quasselstrippe-data-pvc
      terminationGracePeriodSeconds: 30
