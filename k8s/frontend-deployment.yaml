apiVersion: apps/v1
kind: Deployment
metadata:
  name: quasselstrippe-frontend
  namespace: quasselstrippe
  labels:
    app.kubernetes.io/name: quasselstrippe-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: quasselstrippe
spec:
  # Frontend is stateless and can scale horizontally
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quasselstrippe-frontend
  template:
    metadata:
      labels:
        app: quasselstrippe-frontend
        app.kubernetes.io/name: quasselstrippe-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: quasselstrippe-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: quasselstrippe-config
                  key: BACKEND_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
