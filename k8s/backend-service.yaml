apiVersion: v1
kind: Service
metadata:
  name: quasselstrippe-backend
  namespace: quasselstrippe
  labels:
    app.kubernetes.io/name: quasselstrippe-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: quasselstrippe-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
