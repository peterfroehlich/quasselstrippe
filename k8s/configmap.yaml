apiVersion: v1
kind: ConfigMap
metadata:
  name: quasselstrippe-config
  namespace: quasselstrippe
  labels:
    app.kubernetes.io/name: quasselstrippe
data:
  NODE_ENV: "production"
  # Set true when the ingress serves this app exclusively over HTTPS.
  COOKIE_SECURE: "false"
  PORT: "3001"
  DATABASE_PATH: "/data/quasselstrippe.db"
  BACKEND_URL: "http://quasselstrippe-backend:3001"
  # Optional: Generic OpenAI-compatible model endpoint (e.g. Reclopsy on port 11435)
  # AI_BASE_URL: "http://reclopsy.reclopsy.svc.cluster.local:11435/v1"
  # AI_MODEL: "vision-llm"
