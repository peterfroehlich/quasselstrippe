apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quasselstrippe-ingress
  namespace: quasselstrippe
  labels:
    app.kubernetes.io/name: quasselstrippe
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - http:
        paths:
          # API traffic routed to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: quasselstrippe-backend
                port:
                  number: 3001
          # Frontend static UI traffic
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quasselstrippe-frontend
                port:
                  number: 80
