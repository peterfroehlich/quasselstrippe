name: Publish container images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/${{ github.repository_owner }}/quasselstrippe-backend
            dockerfile: ./Dockerfile.backend
          - name: frontend
            image: ghcr.io/${{ github.repository_owner }}/quasselstrippe-frontend
            dockerfile: ./Dockerfile.frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect release tag
        id: relinfo
        run: |
          head="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          if [[ "$head" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "is_release=true"          >> "$GITHUB_OUTPUT"
            echo "semver=${head#v}"         >> "$GITHUB_OUTPUT"
            echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "minor=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false"         >> "$GITHUB_OUTPUT"
          fi
          echo "head=$head"                 >> "$GITHUB_OUTPUT"
          echo "sha=$sha"                   >> "$GITHUB_OUTPUT"

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ steps.relinfo.outputs.sha }}-short
            type=raw,value=${{ steps.relinfo.outputs.head }}
            type=raw,value=${{ steps.relinfo.outputs.semver }},enable=${{ steps.relinfo.outputs.is_release }}
            type=raw,value=${{ steps.relinfo.outputs.major }}.${{ steps.relinfo.outputs.minor }},enable=${{ steps.relinfo.outputs.is_release }}
            type=raw,value=${{ steps.relinfo.outputs.major }},enable=${{ steps.relinfo.outputs.is_release }}
            type=raw,value=latest,enable=${{ steps.relinfo.outputs.is_release }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
